services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boliche
      POSTGRES_PASSWORD: boliche
      POSTGRES_DB: boliche
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boliche"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://boliche:boliche@db:5432/boliche
      JWT_SECRET: dev-change-me
      ENV: dev
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  db_data:
