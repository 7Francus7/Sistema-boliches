services:
  - type: web
    name: boliches-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boliches-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENV
        value: prod
      - key: PORT
        value: 8000

databases:
  - name: boliches-db
    plan: starter
    databaseName: boliches
    user: boliches
